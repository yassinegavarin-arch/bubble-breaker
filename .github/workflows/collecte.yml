# Déclenche la collecte toutes les 3 heures et le classement IA toutes les heures.
# Aucun secret nécessaire : l'application impose elle-même un délai minimum entre deux exécutions.
name: Collecte

on:
  schedule:
    - cron: "23 */3 * * *"   # collecte complète
    - cron: "53 * * * *"     # classement des articles en attente
  workflow_dispatch:

env:
  APP_URL: https://bubble-breaker-psi.vercel.app

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appel de l'application
        run: |
          STEP=all
          if [ "${{ github.event.schedule }}" = "53 * * * *" ]; then STEP=classify; fi
          echo "Étape : $STEP"
          curl -sS -m 90 "$APP_URL/api/cron?step=$STEP" || true
